<style>
/* Layout: deck-style pages (one at a time) in a fixed shell; palms in corners, blue stars, navy-framed photos. Single white look taken from the deck. */
:root{
  --navy:#1e4d72; --blue:#0a4db3; --ink:#1b1b1f; --leaf:#4f7a2f; --paper:#ffffff; --mist:#eef3f8; --line:#c9d6e2; --err:#b3261e; --ok:#1c7a43;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:58px; --bot:84px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* shell */
.top{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:800;color:var(--navy);font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-actions{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;font-size:.95rem;text-decoration:none;line-height:1.1;text-align:center}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:var(--mist);border-color:var(--navy)}
.btn.sm{min-height:40px;padding:0 16px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
#prev{justify-self:start}#next{justify-self:end}
.count{font-size:.85rem;font-weight:600;color:var(--navy);text-align:center;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;top:-1px;height:3px;background:var(--blue);transition:width .3s}
main{padding-top:calc(var(--top) + env(safe-area-inset-top,0px));padding-bottom:calc(var(--bot) + 24px + env(safe-area-inset-bottom,0px))}

#next.go{background:var(--blue);border-color:var(--blue);min-height:54px;padding:0 30px;font-size:1.1rem;box-shadow:0 6px 18px rgba(10,77,179,.35)}
#next.go:hover{background:var(--navy);border-color:var(--navy)}
#prev{min-height:54px;font-size:1rem}
.side{display:none}
@media (min-width:1340px){.side{display:grid;place-items:center;position:fixed;top:50%;z-index:25;width:60px;height:60px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:2.2rem;line-height:1;padding:0 0 4px;box-shadow:0 6px 20px rgba(30,77,114,.25)}.side:hover{background:var(--navy);color:#fff}.side.l{left:24px}.side.r{right:24px;background:var(--blue);border-color:var(--blue);color:#fff}}
@media (prefers-reduced-motion:no-preference){#next.go.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}}
.formerr{display:none;margin:0 0 10px;padding:10px 14px;border-radius:12px;background:#fdecea;color:var(--err);font-weight:600;font-size:.92rem;text-align:center}
.formerr.on{display:block}
/* pages */
.page{position:relative;overflow:hidden;min-height:calc(100dvh - var(--top) - var(--bot) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;align-items:center;padding:36px 16px}
.page[hidden]{display:none}
.page.enter{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{position:relative;z-index:2;width:100%;max-width:1160px;margin:0 auto;min-width:0}
.pm{position:absolute;z-index:1;pointer-events:none;height:auto;max-width:none;width:min(calc(var(--w)*.5vw),230px);transform:rotate(var(--r,0deg)) scaleX(var(--fx,1))}
.pm.tl{top:-6%;left:-6%}.pm.tr{top:-5%;right:-5%}.pm.bl{bottom:-6%;left:-6%}.pm.br{bottom:-6%;right:-5%}
.star{position:absolute;z-index:1;color:var(--blue);width:var(--s,40px);height:var(--s,40px);pointer-events:none;left:var(--x);top:var(--y)}
h1,h2,.h-lg,.h-xl{font-family:var(--display);font-weight:800;color:var(--navy);letter-spacing:-.045em;line-height:.98;margin:0;text-wrap:balance}
.h-xl{font-size:clamp(2.5rem,7.5vw,5.4rem)}
.h-lg{font-size:clamp(2.3rem,6vw,4.6rem)}
.sub{display:flex;gap:12px;align-items:flex-start;font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.sub svg{flex:none;width:34px;height:34px;color:var(--ink);margin-top:-2px}
.lead{font-size:clamp(1rem,1.6vw,1.2rem);max-width:34em;margin:0}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.split>*{min-width:0}
.frame{display:block;width:100%;border:3px solid var(--navy);border-radius:30px;overflow:hidden;background:var(--mist);aspect-ratio:var(--ar,4/3)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame.tall{--ar:4/5}
.cap{font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,2.2vw,1.4rem);color:var(--ink)}
.banner{display:flex;flex-direction:column;gap:28px}
.banner .frame{--ar:2/1;max-width:880px;margin:0 auto}
.banner .row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,64px);align-items:center}
.banner .row>*{min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero .photo{aspect-ratio:3/4;border-radius:0 52% 52% 0/0 38% 38% 0;overflow:hidden;margin-left:-16px;max-height:72vh;width:calc(100% + 16px)}
.hero .photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero .bhk{font-style:italic;text-align:right;font-size:1.15rem;margin:6px 0 0}
.hero .box{display:flex;flex-direction:column;gap:22px}
.meta{display:flex;flex-direction:column;gap:6px;font-size:1rem;overflow-wrap:anywhere}
.meta b{font-style:italic;font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}

/* lists */
.amen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.amen li{display:flex;gap:10px;align-items:flex-start;font-size:1rem;line-height:1.4;padding:3px 0}
.amen li::before{content:"";flex:none;width:14px;height:14px;margin-top:5px;background:var(--blue);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.rules li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:rgba(255,255,255,.94);font-size:.98rem;line-height:1.5;min-width:0}
.rules .n{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums}
.rules .t{min-width:0;overflow-wrap:anywhere}
.amen-title{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.7rem);color:var(--ink);letter-spacing:-.02em;line-height:1.2;display:flex;gap:14px;align-items:center}
.amen-title i{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff}
.amen-title svg{width:26px;height:26px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gal button{padding:0;border:3px solid var(--navy);border-radius:24px;overflow:hidden;background:var(--mist);aspect-ratio:16/10;display:block;min-width:0}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gal button:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,20,32,.92);display:flex;align-items:center;justify-content:center;padding:56px 12px}
.lb img{max-width:100%;max-height:100%;border-radius:14px;display:block}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.5rem;line-height:1;display:grid;place-items:center}
.lb .x{top:calc(8px + env(safe-area-inset-top,0px));right:12px}.lb .pv{left:10px;top:50%}.lb .nx{right:10px;top:50%}

/* enquiry */
.enq{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:start}
.enq aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.enq .contact{display:flex;flex-direction:column;gap:8px;font-size:.98rem;overflow-wrap:anywhere}
.card{scroll-margin-top:calc(var(--top) + 12px);background:#fff;border:2px solid var(--navy);border-radius:28px;padding:clamp(18px,3vw,32px);box-shadow:0 12px 40px rgba(30,77,114,.12);min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.fgrid>*{min-width:0}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lbl{font-weight:600;font-size:.92rem;color:var(--navy)}
.fld .opt{font-weight:400;color:#5b6b7a;font-size:.82rem}
.in{width:100%;min-height:50px;padding:10px 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;text-align:left}

.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,77,179,.18)}
.fld.bad .in,.fld.bad .chips{border-color:var(--err)}
.err{color:var(--err);font-size:.84rem;min-height:0;display:none}
.fld.bad .err{display:block}
.hint{font-size:.8rem;color:#5b6b7a}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}

.pre{display:flex;align-items:stretch}
.pre span{display:grid;place-items:center;padding:0 14px;background:var(--mist);border:2px solid var(--line);border-right:0;border-radius:14px 0 0 14px;font-weight:600;color:var(--navy)}
.pre .in{border-radius:0 14px 14px 0}
.step{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:8px}
.step button{min-height:50px;border-radius:14px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:1.5rem;line-height:1;font-weight:600}

.step .in{text-align:center;font-weight:600;padding:10px 4px;-moz-appearance:textfield}
.step .in::-webkit-outer-spin-button,.step .in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-radius:16px}

.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;justify-content:center;min-height:50px;border:2px solid var(--line);border-radius:14px;font-weight:600;color:var(--navy);background:#fff}
.chips input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.nights{font-size:.9rem;font-weight:600;color:var(--ok)}
.submit{width:100%;min-height:56px;font-size:1.05rem;background:var(--blue);border-color:var(--blue)}
.submit:hover{background:var(--navy);border-color:var(--navy)}
.ok-card{display:flex;flex-direction:column;gap:16px}
.ok-card h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--mist);border-radius:16px;padding:14px 16px;font-size:.92rem;line-height:1.55;margin:0;font-family:var(--body)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.wa{background:#1c7a43;border-color:#1c7a43}.wa:hover{background:#14602f;border-color:#14602f}

/* calendar + menu overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.cal,.menu{width:100%;max-width:400px;max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-h strong{font-family:var(--display);font-size:1.15rem;color:var(--navy);letter-spacing:-.02em;line-height:1.2}
.x-btn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.3rem;line-height:1;color:var(--navy)}
.cal-m{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;font-weight:600;margin-bottom:6px}
.cal-m button{height:44px;border:0;background:transparent;font-size:1.6rem;color:var(--navy);border-radius:12px}
.cal-m button:disabled{opacity:.25;cursor:not-allowed}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow span{text-align:center;font-size:.75rem;font-weight:600;color:#5b6b7a;padding:6px 0}
.days button{aspect-ratio:1;min-height:40px;border:0;border-radius:12px;background:transparent;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.days button:hover:not(:disabled){background:var(--mist)}
.days button:disabled{color:#b6c0ca;cursor:not-allowed;text-decoration:line-through}
.days .today{box-shadow:inset 0 0 0 2px var(--blue)}
.days .range{background:var(--mist);border-radius:0}
.days .sel{background:var(--navy)!important;color:#fff;border-radius:12px}
.cal-f{margin-top:10px;font-size:.84rem;color:#5b6b7a;text-align:center}
.menu h3{margin:0;font-family:var(--display);color:var(--navy);font-size:1.15rem}
.menu ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.menu li button{width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:12px;font-size:.98rem;display:flex;gap:12px}
.menu li button:hover,.menu li button.cur{background:var(--mist)}
.menu li b{flex:none;width:26px;color:var(--blue);font-variant-numeric:tabular-nums}

@media (max-width:860px){
  :root{--top:54px}
  .page{align-items:flex-start;padding:24px 16px 32px}
  .pm{width:calc(var(--w)*.75vw);max-width:170px;opacity:.9}
  .star{display:none}
  .enq .card{order:-1}
  .split,.banner .row,.hero,.enq{grid-template-columns:1fr}

  .hero .photo{margin:0 -16px;width:calc(100% + 32px);aspect-ratio:16/10;max-height:none;border-radius:0 0 50% 50%/0 0 22% 22%}
  .hero .bhk{text-align:left}
  .banner .frame{--ar:16/10}

  #next{padding:0 22px}
}
@media (max-width:480px){
  .fgrid{grid-template-columns:1fr}
  .brand{font-size:.95rem}
  .top .btn{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){.page.enter{animation:none}.bar,.gal img{transition:none}}
</style>

/* ---------- render ---------- */
const host = $('#pages');
pages.forEach((p, i) => {
  const s = document.createElement('section');
  s.className = 'page'; s.hidden = true; s.dataset.i = i; s.setAttribute('aria-label', p.name);
  s.innerHTML = p.html; host.appendChild(s);
});
$('#rules').innerHTML = RULES.map((t, i) => `<li><span class="n">${i+1}</span><span class="t">${t.replace(/&/g,'&amp;')}</span></li>`).join('');
$('#gal').innerHTML = GAL.map((k, i) => `<button type="button" data-lb="${i}" aria-label="Open photo ${i+1}">${img(k, 'Villa photo '+(i+1))}</button>`).join('');
$$('img[data-k]').forEach(im => { im.src = IMG[im.dataset.k]; });
$('#menuL').innerHTML = pages.map((p, i) => `<li><button type="button" data-p="${i}"><b>${i+1}</b><span>${p.name}</span></button></li>`).join('');

/* ---------- navigation ---------- */
let cur = 0;
const enqIdx = pages.findIndex(p => p.id === 'enq');
function show(n, push=true) {
  n = Math.max(0, Math.min(pages.length - 1, n));
  $$('.page').forEach(s => { s.hidden = (+s.dataset.i !== n); s.classList.remove('enter'); });
  const pg = $$('.page')[n]; pg.classList.add('enter');
  cur = n;
  $('#count').textContent = `${n+1} / ${pages.length}`;
  $('#bar').style.width = ((n+1)/pages.length*100) + '%';
  $('#prev').disabled = n === 0;
  $('#next').disabled = n === pages.length - 1;
  $('#next').classList.toggle('pulse', n === 0);
  $('#nextL').textContent = (n === enqIdx - 1) ? 'Enquire Now' : 'Next';
  $('#next').style.visibility = (n === pages.length - 1) ? 'hidden' : 'visible';
  $('#sPrev').style.visibility = n === 0 ? 'hidden' : 'visible';
  $('#sNext').style.visibility = (n >= enqIdx) ? 'hidden' : 'visible';
  $$('#menuL button').forEach(b => b.classList.toggle('cur', +b.dataset.p === n));
  window.scrollTo(0, 0);
  try { if (push) history.replaceState(null, '', '#p' + (n+1)); } catch (e) {}
}
$('#prev').onclick = () => show(cur - 1);
$('#next').onclick = () => show(cur + 1);
$('#sPrev').onclick = () => show(cur - 1);
$('#sNext').onclick = () => show(cur + 1);
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) show(enqIdx); });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!$('#calOv').hidden || !$('#menuOv').hidden || !$('#lb').hidden) return;
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (cur === enqIdx || !$('#calOv').hidden || !$('#menuOv').hidden || !$('#lb').hidden) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 90 && Math.abs(dy) < Math.abs(dx) * .4) show(cur + (dx < 0 ? 1 : -1));
}, {passive:true});

/* menu */
const menuOv = $('#menuOv');
$('#menuBtn').onclick = () => { menuOv.hidden = false; };
$('#menuX').onclick = () => { menuOv.hidden = true; };
menuOv.addEventListener('click', e => { if (e.target === menuOv) menuOv.hidden = true; const b = e.target.closest('[data-p]'); if (b) { menuOv.hidden = true; show(+b.dataset.p); } });

/* lightbox */
let li = 0; const lb = $('#lb');
function openLb(i) { li = (i + GAL.length) % GAL.length; $('#lbI').src = IMG[GAL[li]]; lb.hidden = false; }
$('#gal').addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) openLb(+b.dataset.lb); });
$('#lbX').onclick = () => lb.hidden = true;
$('#lbP').onclick = () => openLb(li - 1);
$('#lbN').onclick = () => openLb(li + 1);
lb.addEventListener('click', e => { if (e.target === lb) lb.hidden = true; });

/* ---------- calendar ---------- */
const today = new Date(); today.setHours(0,0,0,0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const same = (a, b) => a && b && a.getTime() === b.getTime();
const fmt = d => d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
let cin = null, cout = null, mode = 'in', view = new Date(today.getFullYear(), today.getMonth(), 1);
const calOv = $('#calOv');
function openCal(m) {
  if (m === 'out' && !cin) m = 'in';
  mode = m;
  const base = m === 'out' ? (cout || addDays(cin, 1)) : (cin || today);
  view = new Date(base.getFullYear(), base.getMonth(), 1);
  calOv.hidden = false; drawCal();
}
function closeCal() { calOv.hidden = true; }
function drawCal() {
  $('#calT').textContent = mode === 'in' ? 'Select check-in date' : 'Select check-out date';
  $('#calM').textContent = view.toLocaleDateString('en-IN', {month:'long', year:'numeric'});
  $('#calP').disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
  const first = view.getDay(), n = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const minD = mode === 'out' ? addDays(cin, 1) : today;
  let h = '<span></span>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const dt = new Date(view.getFullYear(), view.getMonth(), d);
    const dis = dt < minD;
    const sel = same(dt, cin) || same(dt, cout);
    const rng = cin && cout && dt > cin && dt < cout;
    h += `<button type="button" data-d="${dt.getTime()}" class="${same(dt,today)?'today ':''}${sel?'sel ':''}${rng?'range':''}" ${dis?'disabled':''} aria-label="${fmt(dt)}">${d}</button>`;
  }
  $('#calD').innerHTML = h;
  $('#calF').textContent = mode === 'out' && cin ? `Check-in: ${fmt(cin)}` : `Today is ${fmt(today)}`;
}
$('#calP').onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); drawCal(); };
$('#calN').onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); drawCal(); };
$('#calX').onclick = closeCal;
calOv.addEventListener('click', e => {
  if (e.target === calOv) return closeCal();
  const b = e.target.closest('[data-d]'); if (!b || b.disabled) return;
  const d = new Date(+b.dataset.d);
  if (mode === 'in') {
    cin = d; if (cout && cout <= cin) cout = null;
    setDate('in'); setDate('out');
    mode = 'out'; view = new Date(d.getFullYear(), d.getMonth(), 1); drawCal();
  } else { cout = d; setDate('out'); closeCal(); }
  updateNights();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCal(); menuOv.hidden = true; lb.hidden = true; } });
function setDate(w) {
  const d = w === 'in' ? cin : cout, el = $('#' + (w === 'in' ? 'inTxt' : 'outTxt'));
  el.textContent = d ? fmt(d) : (w === 'in' ? 'Select check-in date' : 'Select check-out date');
  el.className = d ? '' : 'ph';
  if (d) $('#f' + w).classList.remove('bad');
}
function updateNights() {
  const el = $('#nights');
  if (cin && cout) { const n = Math.round((cout - cin) / 864e5); el.textContent = `${n} night${n>1?'s':''} stay`; } else el.textContent = '';
}

/* ---------- form ---------- */
$('#dIn').onclick = () => openCal('in');
$('#dOut').onclick = () => openCal('out');
function clampNum(el, min, max) { let v = parseInt(el.value, 10); if (isNaN(v)) v = min; el.value = Math.max(min, Math.min(max, v)); }
function bindStep(id, min, getMax) {
  const el = $('#' + id);
  $$(`[data-s="${id}"]`).forEach(b => b.onclick = () => { el.value = (parseInt(el.value,10) || 0) + (+b.dataset.v); clampNum(el, min, getMax()); sync(); });
  el.addEventListener('change', () => { clampNum(el, min, getMax()); sync(); });
}
function sync() { clampNum($('#kids'), 0, Math.max(0, +$('#people').value)); }
bindStep('people', 1, () => 40);
bindStep('kids', 0, () => +$('#people').value);

function bad(id, on) { $('#f' + id).classList.toggle('bad', on); return on; }
function validate() {
  const errs = [];
  const name = $('#name').value.trim();
  if (bad('name', name.length < 2)) errs.push('name');
  const digits = $('#phone').value.replace(/\D/g, '');
  if (bad('phone', digits.length < 10 || digits.length > 15)) errs.push('phone');
  if (bad('in', !cin)) errs.push('dIn');
  if (bad('out', !cout)) errs.push('dOut');
  if (bad('people', !(+$('#people').value >= 1))) errs.push('people');
  if (bad('grp', !$('input[name=grp]:checked'))) errs.push('grpF');
  if (bad('budget', $('#budget').value.trim().length < 1)) errs.push('budget');
  return errs;
}
['name','phone','budget'].forEach(id => $('#'+id).addEventListener('input', () => $('#f'+id).classList.remove('bad')));
$$('input[name=grp]').forEach(r => r.addEventListener('change', () => $('#fgrp').classList.remove('bad')));

function buildMsg() {
  const n = Math.round((cout - cin) / 864e5);
  const b = $('#budget').value.trim(), bn = b.replace(/[,\s₹]|rs\.?/gi, '');
  const bud = /^\d+$/.test(bn) ? '₹' + (+bn).toLocaleString('en-IN') : b;
  const req = $('#req').value.trim();
  return [
    '*New Enquiry - Taras Villa Lonavala*', '',
    `*Name:* ${$('#name').value.trim()}`,
    `*Number:* ${(()=>{const d=$('#phone').value.replace(/\D/g,'');return d.length===10?'+91 '+d:'+'+d})()}`,
    `*Check-in:* ${fmt(cin)}`,
    `*Check-out:* ${fmt(cout)} (${n} night${n>1?'s':''})`,
    `*Guests:* ${$('#people').value}`,
    `*Kids:* ${$('#kids').value}`,
    `*Group:* ${$('input[name=grp]:checked').value}`,
    `*Requirement:* ${req || 'None'}`,
    `*Budget:* ${bud}`
  ].join('\n');
}
let lastMsg = '';
$('#enqForm').addEventListener('submit', e => {
  e.preventDefault();
  const errs = validate();
  $('#formErr').classList.toggle('on', errs.length > 0);
  if (errs.length) { const t = $('#' + errs[0]); t.scrollIntoView({block:'center', behavior:'smooth'}); try { t.focus({preventScroll:true}); } catch (x) {} return; }
  lastMsg = buildMsg();
  const url = `https://wa.me/${WA}?text=${encodeURIComponent(lastMsg)}`;
  $('#waLink').href = url; $('#msgBox').textContent = lastMsg;
  $('#formWrap').hidden = true; $('#okWrap').hidden = false;
  $('#formCard').scrollIntoView({block:'start'});
  if (window.self === window.top) { window.location.href = url; }
  else { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
});
$('#editBtn').onclick = () => { $('#okWrap').hidden = true; $('#formWrap').hidden = false; };
$('#copyBtn').onclick = async () => {
  const b = $('#copyBtn');
  try { await navigator.clipboard.writeText(lastMsg); b.textContent = 'Copied'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('#msgBox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, press copy'; }
  setTimeout(() => b.textContent = 'Copy message', 2200);
};

/* start */
const m = /^#p(\d+)$/.exec(location.hash);
show(m ? +m[1] - 1 : 0, false);
</script>
